<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Swing analysis{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">
    <span class="mark" aria-hidden="true"></span>
    <span>Swing&nbsp;analysis</span>
  </a>
  <nav>
    <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="here"{% endif %}>Swings</a>
    <a href="{{ url_for('session_page') }}" {% if request.endpoint == 'session_page' %}class="here"{% endif %}>Consistency</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="foot">
  <p>Everything runs on this machine. No clip leaves it.</p>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
