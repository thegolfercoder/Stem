[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimodeldb"
version = "0.1.0"
description = "A structured, source-verified catalogue of AI models and tools, organised by what they are for."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "thegolfercoder" }]
keywords = ["ai", "llm", "catalogue", "dataset", "model-selection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
aimodeldb = "aimodeldb.cli:main"

[project.urls]
Repository = "https://github.com/thegolfercoder/ai-model-database"

[tool.hatch.build.targets.wheel]
packages = ["src/aimodeldb"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET", "ARG"]
ignore = ["ARG002"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
