[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evosim"
version = "0.1.0"
description = "Artificial Life Evolution Simulator - a scientific digital ecosystem where organisms evolve by natural selection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EvoSim" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
viz = ["pygame>=2.5"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["evosim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
