[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradelab"
version = "0.1.0"
description = "An event-driven backtesting framework for systematic trading research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "thegolfercoder" }]
keywords = ["backtesting", "quantitative-finance", "trading", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]
plotly = ["plotly>=5.18"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
  "types-PyYAML",
  "pyarrow>=14.0",
  "jupyter>=1.0",
]

[project.scripts]
tradelab = "tradelab.cli:main"

[project.urls]
Repository = "https://github.com/thegolfercoder/trading-algorithm"

[tool.hatch.build.targets.wheel]
packages = ["src/tradelab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "SLF", "ARG", "RET"]
ignore = [
  "N803",  # capital letters are the notation finance actually uses
  "N806",
  "ARG002",  # an interface implementation that ignores an argument is the point of an interface
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]
