name: iphone app

# The Swing Studio iPhone app. The analysis core (ios/SwingCore) is plain Swift
# and its tests - held to the browser engine's answers on a real swing - run on
# Linux. The app itself needs Xcode, so it is built for the simulator on macOS,
# with MediaPipe from CocoaPods and the pose model fetched as setup.sh does.
on:
  workflow_dispatch:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  core:
    name: swing core (swift test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ios/SwingCore
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: swift test

  app:
    name: app (xcodebuild, simulator)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: brew install xcodegen
      - name: pose model
        run: |
          curl -L --fail -o SwingStudio/Resources/pose_landmarker_heavy.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task
      - name: project
        run: |
          xcodegen generate
          pod install
      - name: build
        run: |
          xcodebuild -workspace SwingStudio.xcworkspace -scheme SwingStudio \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
