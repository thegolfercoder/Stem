name: checks

# Nothing ran these before. A hundred and fifty tests in the repository and no
# machine that executed them on a push, which is the same as not having them the
# moment somebody forgets - and this project has already shipped two faults that
# a test would have caught, because nothing opened the page and looked.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  swingml:
    name: swing analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swingml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: pip install -e ".[dev]"
      - name: lint
        run: |
          ruff check .
          ruff format --check .
      - name: types
        # The scripts are checked too. They are where the training runs, the
        # calibration and the dataset builds live, and a fault in one of those
        # costs however long the run took to discover - which is the argument for
        # checking them, not against.
        run: |
          mypy -p swingml -p synth
          mypy scripts
      - name: tests
        # The browser and parity tests skip themselves when the built page and
        # the exported weights are absent, which they are in a fresh checkout -
        # both are build products. Everything that does not need them runs.
        run: pytest -q

  launchmon:
    name: radar dsp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launchmon-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: pip install -e ".[dev]"
      - name: lint
        run: |
          ruff check .
          ruff format --check .
      - name: types
        run: mypy -p launchmon
      - name: tests
        run: pytest -q
