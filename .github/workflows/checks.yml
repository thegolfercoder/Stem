name: checks

# Nothing ran these before: three hundred tests across the two projects and no
# machine that executed any of them on a push, which is the same as not having
# them the moment somebody forgets. This project has already shipped two faults
# a test would have caught, because nothing opened the page and looked - and a
# third that this workflow did catch and that nobody read, which is the other
# half of the problem.
#
# A fresh checkout has no out/, so it runs the checkpoint bundled in the package
# rather than an ensemble a developer happens to have trained. That difference is
# what caught the third fault, and the real-swing test now covers both so it does
# not take a clean machine to notice.
on:
  # Not every branch on push as well as on pull_request: that ran the whole suite
  # twice for every commit on an open pull request, against the same commit.
  push:
    branches: [main]
  pull_request:

jobs:
  swingml:
    name: swing analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swingml
    steps:
      # v5/v6/v5: the Node 24 releases. The v4/v5/v4 ones ran on Node 20, which
      # the runner deprecates and was already forcing onto Node 24 with a warning.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: swingml/requirements-dev.lock
      - name: install
        # libEGL: MediaPipe's native runtime loads it when a pose landmarker is
        # created, and ubuntu-latest does not ship it. Without it the tests that
        # run the real estimator (the capture preflight) cannot run here.
        # The lock pins every package, so a run fails for a change in this
        # repository and not for a release somebody else made that morning.
        # Regenerate it with the command at its top after changing pyproject.toml.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgles2
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
      - name: lint
        run: |
          ruff check .
          ruff format --check .
      - name: types
        # The scripts are checked too. They are where the training runs, the
        # calibration and the dataset builds live, and a fault in one of those
        # costs however long the run took to discover - which is the argument for
        # checking them, not against.
        run: |
          mypy -p swingml -p synth
          mypy scripts
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: browser payload
        # The browser/Python parity tests skip themselves without the exported
        # weights, and a fresh checkout has none - so for as long as this step was
        # missing, all 22 of them were skipped here on every run and nothing in CI
        # compared the browser engine with Python. Exporting takes two seconds.
        run: python scripts/export_web_model.py
      - name: tests
        # Only the page test still skips: it needs Playwright and a browser.
        run: pytest -q -rs
      - name: agent loop
        # The backlog ranker, item validator and loop settings the three agents
        # rely on (agents/README.md). Standard library only.
        run: |
          python -m pytest -q ../agents/tests
          python ../agents/loop.py config > /dev/null

  launchmon:
    name: radar dsp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launchmon-py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: pip install -e ".[dev]"
      - name: lint
        run: |
          ruff check .
          ruff format --check .
      - name: types
        run: mypy -p launchmon
      - name: tests
        run: pytest -q
