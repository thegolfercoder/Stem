name: Build EvoSim Desktop (Windows)

# Packages the premium web edition (standalone/EvoSim.html) into a native
# Windows executable using a system-webview shell (pywebview) + PyInstaller.
# The HTML is bundled inside the .exe; on Windows it renders via the built-in
# WebView2 (Edge-Chromium) runtime, so the binary stays small.

on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/artificial-life-evolution-sim-cnmdm9"
    paths:
      - "standalone/EvoSim.html"
      - "standalone/evosim_desktop.py"
      - ".github/workflows/build-evosim-app.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --upgrade pip pywebview pyinstaller

      - name: Build EvoSimApp.exe
        working-directory: standalone
        run: >
          pyinstaller --onefile --windowed --clean --name EvoSimApp
          --add-data "EvoSim.html;."
          --collect-all webview
          evosim_desktop.py

      - name: Upload the .exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvoSimApp-windows
          path: standalone/dist/EvoSimApp.exe
          if-no-files-found: error

      - name: Attach to Release on version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: standalone/dist/EvoSimApp.exe
