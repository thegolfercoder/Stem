# Donchian channel breakout, in the shape the original Turtle rules used.
#
# Included alongside trend_sma because the two are the same idea expressed
# differently: if one works on a dataset and the other does not, the difference
# is the implementation rather than the premise, and that is worth knowing.
name: breakout
notes: >
  Enter long on a 55-bar high, exit on a 20-bar low, sized so a one-ATR move
  costs 2% of equity.

strategy:
  type: breakout
  parameters:
    entry_window: 55
    exit_window: 20
    atr_window: 20
    risk_fraction: 0.02

data:
  directory: data/sample
  development_end: "2019-12-31"

backtest:
  initial_capital: 100000
  rebalance_tolerance: 0.05
  commission: { type: bps, bps: 2.0 }
  slippage: { type: volume_share, spread_bps: 3.0, coefficient: 0.6 }

risk:
  limits:
    max_position_weight: 0.35
    max_gross_exposure: 1.0
    max_net_exposure: 1.0
    allow_shorts: false
