slug: gemini-embedding-2
name: Gemini Embedding 2
provider: Google
kind: model
model_id: gemini-embedding-2-preview
status: preview
summary: >
  A multimodal embedding model that maps text, images, video, audio and PDFs
  into one vector space, priced per modality.

categories:
  - id: embeddings
    tier: recommended
    rationale: >
      Maps five input modalities into a shared space, which is what makes
      search across a mixed corpus possible without a separate index per
      media type.
    evidence: [google-models, google-pricing]

use_cases:
  - Retrieval over a corpus mixing documents, images and recordings
  - Semantic search and clustering
  - RAG pipelines with non-text sources

strengths:
  - One embedding space across text, image, video, audio and PDF
  - Text embedding at $0.20 per million tokens

weaknesses:
  - Preview status
  - Non-text modalities cost far more - $0.45 per million for image, $6.50 for audio, $12.00 for video
  - Dimensionality and benchmark retrieval quality are not stated in the sources consulted
  - Switching embedding models later means re-embedding the whole corpus, so this is a stickier choice than a text model

modalities:
  input: [text, image, audio, video, pdf]
  output: [embedding]

api:
  available: true
  docs_url: https://ai.google.dev/gemini-api/docs

openness:
  weights: closed

pricing:
  unit: per_million_tokens
  input_usd: 0.2
  source: google-pricing
  note: >
    Text $0.20, image $0.45, audio $6.50, video $12.00 per million tokens.
    The recorded figure is the text rate; budget the others separately.

sources:
  - id: google-models
    url: https://ai.google.dev/gemini-api/docs/models
    kind: official
    title: Gemini API models
    retrieved: 2026-09-07
  - id: google-pricing
    url: https://ai.google.dev/gemini-api/docs/pricing
    kind: official
    title: Gemini API pricing
    retrieved: 2026-09-07

verification:
  last_verified: 2026-09-07
  method: official_docs
  verified_fields: [existence, model_id, pricing, api, openness, status, modalities]

notes: >
  The 60x price spread between text and video embedding is the number to plan
  around. A "multimodal RAG" costing exercise done at the text rate will be
  wrong by more than an order of magnitude if the corpus is mostly video.

alternatives: [gemini-3.5-flash-lite]
