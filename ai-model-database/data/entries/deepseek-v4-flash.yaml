slug: deepseek-v4-flash
name: DeepSeek V4 Flash
provider: DeepSeek
kind: model
model_id: deepseek-ai/DeepSeek-V4-Flash-0731
status: available
summary: >
  The smaller, faster line of DeepSeek's V4 family, with open weights and a
  vision-experimental variant published alongside it.

categories:
  - id: local
    tier: open-weight
    rationale: >
      Smaller than the Pro line, which is the property that decides whether a
      model runs on the hardware you actually have. That constraint outranks
      capability comparisons for local deployment.
    evidence: [hf-deepseek]
  - id: coding
    tier: budget
    rationale: >
      The Flash line trades capability for size and speed; for code completion
      and routine edits that trade is often the right one.
    evidence: [hf-deepseek]

use_cases:
  - Local inference on constrained hardware
  - Fast code completion
  - The cheap tier of a self-hosted two-model setup

strengths:
  - Smaller than the Pro line, so it fits on less hardware
  - A vision-experimental variant is published in the same organisation
  - FP8 and quantised variants available

weaknesses:
  - Below the Pro line in capability by the family's own structure
  - Licence terms must be read per model card
  - No context window or benchmark figures recorded here, not having been read from the card
  - Vision variant is marked experimental in its repository name

