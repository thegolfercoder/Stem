slug: gemini-3-pro-image
name: Gemini 3 Pro Image (Nano Banana Pro)
provider: Google
kind: model
model_id: gemini-3-pro-image
status: available
summary: >
  Google's higher-end image generation and editing model, described in its own
  documentation as producing studio-quality 4K visuals with complex layouts.

categories:
  - id: image-generation
    tier: recommended
    rationale: >
      The provider's own listing distinguishes this from the Flash image models
      by output resolution and layout complexity, which is a concrete
      difference rather than a general quality claim.
    evidence: [google-models]

use_cases:
  - High-resolution image generation
  - Images with complex text and layout requirements
  - Editing existing images from a prompt

strengths:
  - 4K output per the provider's description
  - Handles complex layouts, which is where many image models fail visibly
  - Available through the same API as the text models, so no second integration

weaknesses:
  - Pricing is per-image and not recorded here; the token pricing table does not cover it
  - Image models change faster than text models and comparisons date quickly
  - No published information here about training data provenance or licensing of outputs, which matters for commercial use

modalities:
  input: [text, image]
  output: [image]

api:
  available: true
  docs_url: https://ai.google.dev/gemini-api/docs

openness:
  weights: closed

