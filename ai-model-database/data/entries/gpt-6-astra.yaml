slug: gpt-6-astra
name: GPT-6 Astra
provider: OpenAI
kind: model
model_id: gpt-6-astra
status: available
summary: >
  OpenAI's current flagship, with a 1.05M-token context window and 128K max
  output, priced at $10/$50 per million tokens.

categories:
  - id: general-reasoning
    tier: recommended
    rationale: >
      OpenAI's flagship tier and the top of its published price list, which is
      the provider's own statement about where it sits relative to the rest of
      the lineup.
    evidence: [openai-pricing, openai-models]
  - id: mathematics
    tier: recommended
    rationale: >
      The frontier tier of a lineup with a long line of reasoning-focused
      models behind it. Verify on your own problems before relying on it -
      published benchmark scores and your workload are different things.
    evidence: [openai-models]
  - id: long-context
    tier: recommended
    rationale: >
      1.05M input tokens, comparable to the largest windows generally
      available. Note the repricing threshold below - long context here is not
      priced flat the way it is at some competitors.
    evidence: [openai-models, openai-pricing]
  - id: coding
    tier: strong-alternative
    rationale: >
      Frontier-tier general capability applies to code, though OpenAI also
      ships Codex-branded models aimed specifically at it.
    evidence: [openai-pricing]

use_cases:
  - Problems where a cheaper tier has been tried and measured as insufficient
  - Analysis over very large inputs
  - Complex multi-step reasoning

strengths:
  - 1.05M-token context with 128K max output
  - Multimodal input
  - Cached input bills at 10% of standard rates, and the Batch API halves everything

weaknesses:
  - $10/$50 per million tokens, the joint-highest in OpenAI's published list alongside o1-pro's far higher rate
  - A prompt past 272K input tokens reprices the *entire* request at 2x input and 1.5x output, so the effective cost of a long-context request is a cliff rather than a slope
  - Released 3 September 2026, so there is little independent evidence about it yet

context_window:
  input_tokens: 1050000
  output_tokens: 128000
  source: openai-models
  note: >
    Requests over 272K input tokens are billed at 2x input and cache rates and
    1.5x output, applied to the whole request rather than the excess.

modalities:
  input: [text, image]
  output: [text]

api:
  available: true
  docs_url: https://developers.openai.com/api/docs

openness:
  weights: closed

pricing:
  unit: per_million_tokens
  input_usd: 10
  output_usd: 50
  source: openai-pricing
  note: Cached input at 10% of standard. Batch API halves both rates.

sources:
  - id: openai-pricing
    url: https://developers.openai.com/api/docs/pricing
    kind: official
    title: OpenAI API pricing
    retrieved: 2026-09-07
  - id: openai-models
    url: https://developers.openai.com/api/docs/models
    kind: official
    title: OpenAI models
    retrieved: 2026-09-07

verification:
  last_verified: 2026-09-07
  method: official_docs
  verified_fields: [existence, model_id, pricing, context_window, api, openness]

notes: >
  The 272K repricing threshold is the detail most likely to surprise someone
  budgeting from the headline rate. A 300K-token request costs twice what the
  list price implies, not 10% more.

alternatives: [claude-opus-5, claude-fable-5-1, gpt-5.6-terra, gemini-3.1-pro]
