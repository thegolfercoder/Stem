slug: gemini-3.5-transcribe
name: Gemini 3.5 Transcribe
provider: Google
kind: model
model_id: gemini-3.5-transcribe
status: available
summary: >
  Google's dedicated speech-to-text model, documented as low-latency with
  utterance-based language detection.

categories:
  - id: speech-to-text
    tier: recommended
    rationale: >
      A purpose-built transcription endpoint rather than a general model
      handling audio as one modality among several, with per-utterance language
      detection called out in the provider's own listing.
    evidence: [google-models]

use_cases:
  - Transcribing recorded audio
  - Multilingual audio where the language changes mid-recording
  - Low-latency transcription pipelines

strengths:
  - Utterance-level language detection, which matters for genuinely multilingual audio
  - Low-latency by the provider's description
  - Same API and billing as the rest of the Gemini line

weaknesses:
  - Per-minute or per-token pricing for this model is not recorded here
  - Diarisation support is not stated in the source consulted
  - Accuracy figures are not published in the source consulted, so there is nothing here to compare against a competitor

modalities:
  input: [audio]
  output: [text]

