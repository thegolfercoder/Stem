slug: qwen3.8-2.4t-a95b
name: Qwen3.8-2.4T-A95B
provider: Alibaba
kind: model
model_id: Qwen/Qwen3.8-2.4T-A95B
status: available
summary: >
  Alibaba's large mixture-of-experts model with published weights, in the
  Qwen3.8 generation. FP8 weights are published alongside the full-precision
  release.

categories:
  - id: general-reasoning
    tier: open-weight
    rationale: >
      The largest model in Alibaba's published Qwen3.8 line, and one of the
      few open-weight models at this scale with weights actually downloadable
      rather than announced.
    evidence: [hf-qwen]
  - id: local
    tier: open-weight
    rationale: >
      Weights and an FP8 variant are published, though at this size "local"
      means a multi-GPU server rather than a workstation.
    evidence: [hf-qwen]

use_cases:
  - Self-hosted deployment where capability matters more than hardware cost
  - Research on a frontier-scale open model
  - Multilingual work, where the Qwen line has historically been strong

strengths:
  - Weights published, including an FP8 variant that halves the memory requirement
  - Part of a large family with smaller dense siblings, so a capability ladder exists within one tokenizer and prompt format

weaknesses:
  - Published under a custom licence rather than Apache 2.0 - read it before commercial use
  - At this scale, self-hosting requires a multi-GPU server; the hardware cost can exceed API spend for low volumes
  - Context window and benchmark figures not recorded here, not having been read from the model card
  - Custom licences on large open-weight models have historically included usage restrictions that matter in regulated industries

