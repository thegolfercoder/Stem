notes: >
  "Open weights" and "open source" are not the same thing, and the Llama
  licence is the clearest example of the difference. If your requirement is
  legal certainty rather than the ability to download, an Apache 2.0 or MIT
  model is a different answer to the same question.

alternatives: [llama-4-maverick, qwen3.8-27b, ministral-3-8b, mistral-large-3]
