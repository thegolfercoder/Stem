    evidence: [hf-zai]

use_cases:
  - Self-hosted coding assistance
  - On-premises deployment where code cannot leave the network
  - Fine-tuning for a specific codebase

strengths:
  - A Flash variant published alongside the full model, so there is a size ladder within one family
  - BF16 variants published for both
  - Predecessor GLM-5.2 reported as MIT licensed with a 1M-token context

weaknesses:
  - Licence for 5.3 specifically not recorded here; it was reported as its own permissive licence rather than inheriting 5.2's MIT
  - Context window and parameter count not recorded for this checkpoint
  - The line moves quickly - three generations in the organisation at time of checking - so a pinned checkpoint matters more than the family name
  - Ecosystem tooling is thinner than Llama's

