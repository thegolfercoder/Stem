# XcodeGen project for the Swing Studio iPhone app. SwingStudio.xcodeproj is
# generated from this file and committed, so the download opens straight in
# Xcode. After changing this file run `xcodegen generate` and commit the result;
# CI fails if the two disagree. ./setup.sh also installs MediaPipe.
name: SwingStudio
options:
  bundleIdPrefix: com.swingml
  deploymentTarget:
    iOS: "17.0"
packages:
  SwingCore:
    path: SwingCore
targets:
  SwingStudio:
    type: application
    platform: iOS
    sources:
      - path: SwingStudio
        # Copied in by the script below, so the committed project is the same
        # whether or not the 30 MB model has been downloaded yet.
        excludes: ["Resources/*.task"]
    dependencies:
      - package: SwingCore
    info:
      path: SwingStudio/Info.plist
      properties:
        CFBundleDisplayName: Swing Studio
        CFBundleShortVersionString: "0.2.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Swing Studio reads the swing videos you choose, on this iPhone. Nothing is uploaded.
        NSLocalNetworkUsageDescription: The coach talks to Ollama running on your own computer, over your Wi-Fi.
        # Ollama on a computer at home is plain http on a local address.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    scheme: {}
    postCompileScripts:
      - name: Pose model
        basedOnDependencyAnalysis: false
        script: |
          # Only a build with MediaPipe (installed by ./setup.sh) can use the model.
          if [ -z "${PODS_ROOT:-}" ]; then
            echo "note: MediaPipe is not installed (run ios/setup.sh); building without the pose tracker"
            exit 0
          fi
          MODEL="$SRCROOT/SwingStudio/Resources/pose_landmarker_heavy.task"
          # The exact pose model the analysis was measured with (#51; swingml/swingml/assets.py).
          POSE_MODEL_URL=https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task
          POSE_MODEL_SHA256=64437af838a65d18e5ba7a0d39b465540069bc8aae8308de3e318aad31fcbc7b
          if [ ! -f "$MODEL" ]; then
            echo "Fetching the pose model (about 30 MB)..."
            if ! curl -L --fail -sS -o "$MODEL.part" "$POSE_MODEL_URL"; then
              rm -f "$MODEL.part"
              echo "warning: could not fetch the pose model; the app will say so until a build can"
              exit 0
            fi
            mv "$MODEL.part" "$MODEL"
          fi
          if [ "$(shasum -a 256 "$MODEL" | cut -d' ' -f1)" != "$POSE_MODEL_SHA256" ]; then
            echo "warning: $MODEL is not the pose model the analysis was measured with, so it is not bundled; delete it to fetch $POSE_MODEL_URL"
            exit 0
          fi
          cp "$MODEL" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swingml.studio
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
