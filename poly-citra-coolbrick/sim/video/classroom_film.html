<html><head><meta charset="utf-8">
<title>CoolBrick Classroom Film</title>

<style>

.tag.big{font-size:30px}

.split{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#0f1a15}
.split div{position:relative;overflow:hidden}
.split img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.split span{position:absolute;left:40px;top:40px;font:800 40px/1 "Archivo";background:var(--panel);padding:14px 18px;border-radius:10px}

.thermo .tube{position:absolute;left:40px;top:0;width:50px;height:540px;border-radius:25px;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.6);overflow:hidden}
.thermo .fill{position:absolute;left:0;right:0;bottom:0;background:var(--orange)}
.thermo .bulb{position:absolute;left:25px;top:520px;width:80px;height:80px;border-radius:50%;background:var(--orange);border:3px solid rgba(255,255,255,.6)}

.fade{position:absolute;inset:0;background:#000;pointer-events:none}
.note{position:absolute;right:40px;bottom:24px;font:500 20px/1 "IBM Plex Mono";color:rgba(255,255,255,.55)}
</style></head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div class="ov" id="labels"></div>

    <div class="split" id="split"><div><img id="imFoam" src="img/styrofoam.jpg" alt=""><span>Styrofoam packaging</span></div><div><img id="imPeel" src="img/peels.jpg" alt=""><span>Orange peels</span></div></div>

    <div class="sdgs" id="sdgs"></div>

    <div class="note" id="note">Temperatures: computer simulation, not lab measurements</div>
    <div class="fade" id="fade"></div>
  </div>
</div>

<script type="module">

const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true});renderer.setSize(1920,1080,false);renderer.setPixelRatio(1);

  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.45,'rgba(255,255,255,.8)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}

const chem=new THREE.Group();scene.add(chem);

const table=new THREE.Mesh(new THREE.CylinderGeometry(40,40,1.5,64),new THREE.MeshStandardMaterial({color:0x1d2a23,roughness:.9}));table.position.y=-.75;table.receiveShadow=true;chem.add(table);

/* ---------- S5 sun test ---------- */
const sun5=new THREE.Group();scene.add(sun5);

const clay5=new THREE.Mesh(new THREE.BoxGeometry(BX,BY,BZ),new THREE.MeshStandardMaterial({color:0xa9502c,roughness:.95,emissive:0xff4a10,emissiveIntensity:0}));

const floor5=new THREE.Mesh(new THREE.PlaneGeometry(200,120),new THREE.MeshStandardMaterial({color:0x17231d,roughness:1}));floor5.rotation.x=-Math.PI/2;floor5.position.y=-BX/2-.4;floor5.receiveShadow=true;sun5.add(floor5);
const sunBall5=new THREE.Mesh(new THREE.SphereGeometry(4,32,32),new THREE.MeshBasicMaterial({color:0xffd36b,toneMapped:false}));sunBall5.position.set(-52,40,-6);sun5.add(sunBall5);

tag('Clay brick',sun5,V(-14,BX/2+5,0),'big');tag('CoolBrick',sun5,V(14,BX/2+5,0),'big o');
const NR=120,NH=90;const rayC=pts(NR,0xffd36b,2.2),rayK=pts(NR,0xffd36b,2.2),heatC=pts(NH,0xff4a2a,2.0),heatK=pts(NH,0xff4a2a,2.0);sun5.add(rayC,rayK,heatC,heatK);
const RJ=[...Array(NR)].map(()=>({x:(rnd()-.5)*(BY-1),z:(rnd()-.5)*(BZ-1),o:rnd()})),HJ=[...Array(NH)].map(()=>({x:(rnd()-.5)*(BY-1),z:(rnd()-.5)*(BZ-1),o:rnd()}));

/* ---------- S6/S7 classroom (1 m = 3 units) ---------- */
const cls=new THREE.Group();scene.add(cls);
const W=21,D=18,H=9.6,TH=0.7;
const wallM=new THREE.MeshStandardMaterial({color:0xd8cbb2,roughness:.95});

box(W+TH,H,TH,wallM,0,H/2,-D/2); // back wall
for(const sx of[-1,1]){const x=sx*W/2;  // side walls with two windows each
  box(TH,3.2,D,wallM,x,1.6,0); box(TH,H-6.6,D,wallM,x,6.6+(H-6.6)/2,0);
  for(const z of[-D/2+1.25,0,D/2-1.25])box(TH,3.4,2.5,wallM,x,4.9,z);}
const floorC=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({color:0x9d9686,roughness:1}));floorC.rotation.x=-Math.PI/2;floorC.receiveShadow=true;cls.add(floorC);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x5d6b4c,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;ground.receiveShadow=true;cls.add(ground);
const roofM=new THREE.MeshStandardMaterial({color:0x8d8d88,roughness:.9});
const roof=box(W+2,0.7,D+1.4,roofM,0,H+.35,0);
const ceilGlow=new THREE.Mesh(new THREE.PlaneGeometry(W-.2,D-.2),new THREE.MeshBasicMaterial({color:0xff6a1a,transparent:true,opacity:0,toneMapped:false,side:THREE.DoubleSide}));

const coatSheet=new THREE.Mesh(new THREE.BoxGeometry(1,0.08,D+1.4),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3,emissive:0x222222}));coatSheet.position.y=H+.74;cls.add(coatSheet);

// desks + students (no faces)
const deskM=new THREE.MeshStandardMaterial({color:0x7a5a3a,roughness:.8}),stuM=new THREE.MeshStandardMaterial({color:0x4c6f9a,roughness:.7}),headM=new THREE.MeshStandardMaterial({color:0x5a4030,roughness:.8});

  for(const dx of[-.9,.9]){const b=new THREE.Mesh(new THREE.CylinderGeometry(.42,.48,1.5,16),stuM);b.position.set(x+dx,2.3,z+1.1);cls.add(b);
    const h=new THREE.Mesh(new THREE.SphereGeometry(.4,16,16),headM);h.position.set(x+dx,3.45,z+1.15);cls.add(h);}}
// fan
const fan=new THREE.Group();fan.position.set(0,H-1.4,0);cls.add(fan);

for(let i=0;i<3;i++){const bl=new THREE.Mesh(new THREE.BoxGeometry(2.6,.06,.45),new THREE.MeshStandardMaterial({color:0xdddddd}));bl.position.x=1.3;const piv=new THREE.Group();piv.rotation.y=i*2*Math.PI/3;piv.add(bl);fan.add(piv);}

const NBW=18;const blueWaves=[];for(let i=0;i<NBW;i++){const pts2=[];for(let k=0;k<30;k++)pts2.push(V(0,0,0));const g=new THREE.BufferGeometry().setFromPoints(pts2);

/* ---------- S8 town ---------- */
const town=new THREE.Group();scene.add(town);

    cap('Two wastes that usually end up in <b>landfill</b>.','',ft(6.4,14));}

  if(S===2){ // chemistry
    cam(V(0,lerp(34,28,seg(t,14,24)),lerp(62,54,seg(t,14,24))),V(0,6,0));key.position.set(-30,70,40);
    const diss=seg(t,15.5,21),mould=seg(t,21.2,23.6);
    const lh=lerp(3.5,5.5,diss)*(1-mould);liquid.scale.y=Math.max(.01,lh);liquid.position.y=lh/2+.2;liquid.visible=mould<.35;liqM.opacity*=1;
    liqM.color.lerpColors(new THREE.Color(0xf5b532),new THREE.Color(0xd8923a),diss);liqM.opacity=lerp(.78,.95,diss);
    bowl.visible=bowlRim.visible=mould<.6;bowl.material.opacity=.22*(1-mould*1.6);
    foams.forEach((m,i)=>{const t0=14.6+m.userData.d;const u=seg(t,t0,t0+.9);const y=lerp(30,lh+1.2,ease(u));const sc=Math.max(.001,1-seg(t,t0+.9,t0+2.8));
      m.position.set(m.userData.x*(1-.35*u),y,m.userData.z);m.rotation.set(t*.7+m.userData.r,m.userData.r,0);m.scale.setScalar(sc);m.visible=t>=t0&&sc>.01;});
    gelBrick.visible=mould>0;gelBrick.scale.setScalar(Math.max(.01,ease(mould)));gelBrick.position.set(0,lerp(2,BY/2,ease(mould)),0);gelBrick.rotation.y=mould*.5;
    if(t<21)cap('<b>Limonene</b> from orange peel dissolves the foam into a gel.','',ft(14.4,21.2));
    else cap('The gel is moulded into a <b>brick</b>.','',ft(21,24));}

  if(S===3){ // inside the brick
    const steps=[['coat',25.2,27.2],['air',27.2,29.2],['pcm',29.2,31.2],['body',31.2,33.2],['key',33.2,35.2]];
    const asm=ease(seg(t,34.6,35.9)),ex=ease(seg(t,24.2,25.4))*(1-asm);
    hero.g.position.set(0,6,0);hero.g.rotation.set(0,-.5+seg(t,24,36)*.45,0);parts.forEach(([m,o])=>m.position.copy(m.userData.home).addScaledVector(o,ex));
    const cur=steps.find(s=>t>=s[1]&&t<s[2]);const hi=cur?cur[0]:null;partOp(!!hi&&asm<.4,hi);

    const pulse=.4+.4*Math.sin(t*6);
    hero.coatM.emissive.setHex(hi==='coat'?0x555544:0);hero.coatM.emissiveIntensity=pulse;hero.airM.emissive.setHex(hi==='air'?0x1d5b8c:0);hero.airM.emissiveIntensity=pulse;
    hero.pcmM.emissive.setHex(hi==='pcm'?0x6a2b99:0);hero.pcmM.emissiveIntensity=pulse;hero.keyM.emissive.setHex(hi==='key'?0x6b5524:0);hero.keyM.emissiveIntensity=pulse;
    hero.shellM.emissive.setHex(hi==='body'?0x4a3410:0);hero.shellM.emissiveIntensity=pulse;
    pedestal.position.y=6-BY/2-1.25-ex*3;
    cam(V(lerp(24,18,seg(t,24,36)),lerp(25,20,seg(t,24,36)),lerp(42,36,seg(t,24,36))),V(1,9,0));key.position.set(-40,60,30);
    cap('Inside the <b>CoolBrick</b>','',ft(24.3,36));$('cap').style.bottom='60px';}
  else{pedestal.position.y=-BY/2-1.25;$('cap').style.bottom='90px';}

  if(S===4){ // sun test
    cam(V(0,6,lerp(86,78,seg(t,36,46))),V(0,-5,0));key.position.copy(sunBall5.position);key.target.position.set(0,0,0);key.intensity=2.2;
    const u=seg(t,36.6,45.5);
    const doRays=(p,bx,cool)=>{for(let i=0;i<NR;i++){const r=RJ[i],ph=(t*.6+r.o)%1;const Sx=sunBall5.position;const Hh=V(bx+r.x,BX/2+(cool?.7:0),r.z);

    cam(cp,ct);key.position.copy(sunC.position);key.target.position.set(0,0,0);key.intensity=2.0;hemi.intensity=.65;scene.background.setHex(0x9fb8c9);
    fan.rotation.y=t*7;
    const coatU=fix?ease(seg(t,57,59.4)):0;coatSheet.visible=coatU>0;coatSheet.scale.x=Math.max(.01,coatU*(W+2));coatSheet.position.x=-(W+2)/2+coatU*(W+2)/2;

    const heat=fix?lerp(1,0.15,ease(seg(t,59,64))):seg(t,46.5,52);
    ceilGlow.material.opacity=heat*.55;heatLight.intensity=heat*120;
    shimmer.forEach((m,i)=>{const ph=(t*.25+m.userData.o)%1;m.position.set(0,H-.6-ph*5,0);m.rotation.x=-Math.PI/2;m.material.opacity=heat*.18*(1-ph);
      const a=m.geometry.attributes.position;for(let k=0;k<a.count;k++){a.setZ(k,Math.sin(a.getX(k)*.8+t*3+i)*.25);}a.needsUpdate=true;});
    // rays + blue waves
    for(let i=0;i<NCR;i++){const r=CR[i],ph=(t*.5+r.o)%1;const Hh=V(r.x,H+.8,r.z);
      if(ph<.55){const P=sunC.position.clone().lerp(Hh,ph/.55);setPt(rayR,i,P.x,P.y,P.z);}
      else if(coatU>r.x/(W)+.5&&i%10!==0){const d=Hh.clone().sub(sunC.position).normalize();d.y=-d.y;const P=Hh.clone().addScaledVector(d,(ph-.55)/.45*40);setPt(rayR,i,P.x,P.y,P.z);}

    blueWaves.forEach(l=>{const ph=(t*.35+l.userData.o)%1;const a=l.geometry.attributes.position;for(let k=0;k<30;k++){const y=H+1+ph*8+k*.25;a.setXYZ(k,l.userData.x+Math.sin(k*.7+t*4)*.35,y,l.userData.z);}a.needsUpdate=true;
      l.material.opacity=coatU>(l.userData.x/W+.5)?(1-ph)*.9:0;});
    const js=fix?ease(seg(t,61,63)):0;jaalis.forEach(j=>{j.visible=js>0;j.position.set(j.userData.sx*(W/2+1.4),4.9,lerp(-D*1.1,0,js));});
