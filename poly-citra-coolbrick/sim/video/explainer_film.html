<!doctype html>
<html><head><meta charset="utf-8">
<title>CoolBrick Explainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--ink:#f4f2ec;--ink2:#c9d1c7;--dim:#8e998f;--o:#E8731A;--g:#2E7D32;--b:#1E88C8;--bg:#0f1a15;--card:#18251e;--line:rgba(255,255,255,.14)}
html,body{margin:0;background:var(--bg);overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;font-family:"IBM Plex Sans",sans-serif;color:var(--ink);overflow:hidden;background:var(--bg)}
canvas#gl{position:absolute;inset:0}
.ov{position:absolute;inset:0;pointer-events:none}
.steps{position:absolute;top:34px;left:60px;right:60px;display:flex;gap:10px}
.steps div{flex:1;height:54px;border-radius:12px;background:rgba(12,20,16,.7);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;font:600 22px/1 "IBM Plex Sans";color:var(--dim)}
.steps div b{font:800 22px/1 "Archivo"}
.steps div.on{border-color:var(--o);color:#fff;background:rgba(232,115,26,.25)}
.steps div.done{color:var(--ink2)}
.head{position:absolute;top:116px;left:60px;max-width:1800px;display:grid;gap:10px}
.head h2{margin:0;font:800 62px/1.08 "Archivo",sans-serif;text-shadow:0 4px 28px rgba(0,0,0,.55)}
.head h2 b{color:var(--o)}
.head p{margin:0;font:500 32px/1.3 "IBM Plex Sans";color:var(--ink2);text-shadow:0 3px 18px rgba(0,0,0,.6)}
.head .box{background:rgba(10,17,13,.62);padding:22px 30px;border-radius:18px;display:grid;gap:10px}
.tag{font:700 26px/1.15 "Archivo",sans-serif;color:#10180f;background:var(--ink);padding:12px 16px;border-radius:10px;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.tag.o{background:var(--o);color:#fff}.tag.b{background:var(--b);color:#fff}
.thermo{position:absolute;right:110px;top:300px;width:300px;height:640px}
.thermo .tube{position:absolute;left:200px;top:0;width:50px;height:540px;border-radius:25px;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.6);overflow:hidden}
.thermo .fill{position:absolute;left:0;right:0;bottom:0;background:var(--o)}
.thermo .bulb{position:absolute;left:185px;top:520px;width:80px;height:80px;border-radius:50%;background:var(--o);border:3px solid rgba(255,255,255,.6)}
.thermo .val{position:absolute;right:120px;top:200px;font:900 88px/1 "Archivo";white-space:nowrap;text-shadow:0 4px 24px rgba(0,0,0,.6);text-align:right}
.thermo .lab{position:absolute;right:120px;top:300px;font:600 26px/1.2 "IBM Plex Sans";color:var(--ink2);text-align:right;white-space:nowrap}
.panel{position:absolute;inset:0;background:var(--bg)}
svg text{font-family:"IBM Plex Sans",sans-serif}
.fade{position:absolute;inset:0;background:#000}
.note{position:absolute;right:50px;bottom:26px;font:500 21px/1 "IBM Plex Mono";color:rgba(255,255,255,.55)}
.credit{position:absolute;left:0;right:0;bottom:60px;text-align:center;font:600 30px/1.3 "IBM Plex Mono";letter-spacing:.06em;color:var(--ink2)}
</style></head>
<body>

<canvas id="gl" width="1920" height="1080"></canvas>
<div class="ov" id="labels"></div>
