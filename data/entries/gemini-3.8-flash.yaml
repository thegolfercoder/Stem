slug: gemini-3.8-flash
name: Gemini 3.8 Flash
provider: Google
kind: model
model_id: gemini-3.8-flash
status: available
summary: >
  Google's current Flash model, described in its own documentation as
  engineered for long-horizon software engineering, at $0.75/$3.75 per million
  tokens.

categories:
  - id: coding
    tier: recommended
    rationale: >
      Google's model listing describes this one specifically as engineered for
      long-horizon software engineering, which is a narrower and more checkable
      claim than a general capability ranking.
    evidence: [google-models]
  - id: general-reasoning
    tier: strong-alternative
    rationale: >
      Priced between the budget and frontier tiers of the other major
      providers, with multimodal input, which makes it a reasonable default
      when cost matters and the task is not the hardest available.
    evidence: [google-pricing]
  - id: agentic
    tier: strong-alternative
    rationale: >
      Positioned for long-horizon work, and cheap enough that an agent loop
      with many turns does not become the dominant cost.
    evidence: [google-models, google-pricing]
  - id: vision
    tier: recommended
    rationale: >
      Gemini models take image, video and audio input natively rather than
      through a separate vision endpoint, and the pricing page rates those
      modalities directly.
    evidence: [google-pricing]

use_cases:
  - Agentic coding at a lower price point than the frontier tiers
  - Multimodal input over images and video
  - High-volume production work

strengths:
  - $0.75/$3.75, well below the frontier tiers of Anthropic and OpenAI
  - Native multimodal input including video and audio
  - Batch mode runs at 50% of list price

weaknesses:
  - Released 2 September 2026, so little independent evidence exists yet
  - Google's published pricing notes that rates increase on 1 January 2027 for several models, so this price is not stable
  - Google shipped four Flash models in roughly 100 days; a model at this position in the lineup should be expected to be superseded quickly
  - Token limits are not stated on the model listing page, so the context window here is not recorded

modalities:
  input: [text, image, audio, video, pdf]
  output: [text]

api:
  available: true
  docs_url: https://ai.google.dev/gemini-api/docs

openness:
  weights: closed

pricing:
  unit: per_million_tokens
  input_usd: 0.75
  output_usd: 3.75
  source: google-pricing
  note: >
    Current through 31 December 2026; Google's pricing page states rates
    increase on 1 January 2027 for several models.

