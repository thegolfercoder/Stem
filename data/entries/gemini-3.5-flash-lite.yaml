slug: gemini-3.5-flash-lite
name: Gemini 3.5 Flash-Lite
provider: Google
kind: model
model_id: gemini-3.5-flash-lite
status: available
summary: >
  Google's cheapest 3.5-generation model at $0.30/$2.50 per million tokens,
  described in its own documentation as the fastest and most cost-effective of
  that generation.

categories:
  - id: general-reasoning
    tier: budget
    rationale: >
      $0.30 per million input tokens with native multimodal input. Google's own
      listing positions it as the fastest and most cost-effective option in the
      3.5 generation.
    evidence: [google-models, google-pricing]
  - id: productivity
    tier: strong-alternative
    rationale: >
      Cheap enough for bulk summarising and classification, and takes images
      and audio directly rather than needing a separate pipeline for them.
    evidence: [google-pricing]
  - id: education
    tier: strong-alternative
    rationale: >
      Low latency and low cost suit long back-and-forth explanation sessions
      where the total token count grows quickly.
    evidence: [google-models]

use_cases:
  - High-throughput classification and extraction
  - Cheap multimodal input handling
  - Interactive features where latency matters more than depth

strengths:
  - $0.30/$2.50 per million tokens
  - Native multimodal input at a budget price point
  - Batch mode halves it again

weaknesses:
  - A 3.5-generation model in a lineup that has reached 3.8, so it is behind the current Flash line
  - Google's pricing page notes rate increases from 1 January 2027
  - Audio input is priced separately and higher than text on some models in this family - check the unit before budgeting an audio workload
  - Token limits not stated on the model listing page, so no context window is recorded here

modalities:
  input: [text, image, audio, video, pdf]
  output: [text]

api:
  available: true
  docs_url: https://ai.google.dev/gemini-api/docs

openness:
  weights: closed

pricing:
  unit: per_million_tokens
  input_usd: 0.3
  output_usd: 2.5
  source: google-pricing

