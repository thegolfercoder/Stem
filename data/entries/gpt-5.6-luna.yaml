slug: gpt-5.6-luna
name: GPT-5.6 Luna
provider: OpenAI
kind: model
model_id: gpt-5.6-luna
status: available
summary: >
  The cheapest tier of the GPT-5.6 family at $0.20/$1.20 per million tokens,
  with the same 1.05M-token context window as its larger siblings.

categories:
  - id: general-reasoning
    tier: budget
    rationale: >
      A tenth of Terra's input price and a fiftieth of Astra's, with the same
      context window. The capability gap is real; the price gap is larger.
    evidence: [openai-pricing, openai-models]
  - id: productivity
    tier: recommended
    rationale: >
      At $0.20/MTok, summarising and classifying at volume costs little enough
      that the engineering around it dominates the bill.
    evidence: [openai-pricing]
  - id: long-context
    tier: budget
    rationale: >
      A 1.05M-token window at $0.20/MTok is the cheapest way in this database
      to put a very large document in front of a hosted model.
    evidence: [openai-pricing, openai-models]

use_cases:
  - Classification, extraction and routing at scale
  - First-pass triage in a two-model system
  - Cheap summarisation of long documents

strengths:
  - $0.20/$1.20 per million tokens
  - Full 1.05M context, not a reduced window as budget tiers often carry
  - Batch API halves the rates again

weaknesses:
  - The bottom tier of its family; expect it to fail on problems the larger tiers handle
  - A large context window does not imply good performance across it - retrieval quality at 900K tokens is not something the price tier guarantees
  - Cheap models are the ones most likely to be quietly deprecated when a family is refreshed

context_window:
  input_tokens: 1050000
  output_tokens: 128000
  source: openai-models

