slug: gpt-5.6-terra
name: GPT-5.6 Terra
provider: OpenAI
kind: model
model_id: gpt-5.6-terra
status: available
summary: >
  The middle tier of OpenAI's GPT-5.6 family, at $2/$12 per million tokens with
  the same 1.05M-token context as the flagship.

categories:
  - id: general-reasoning
    tier: strong-alternative
    rationale: >
      A fifth of Astra's input price with the same context window, which makes
      it the sensible default for volume work in OpenAI's lineup.
    evidence: [openai-pricing, openai-models]
  - id: long-context
    tier: strong-alternative
    rationale: >
      1.05M input tokens at $2/MTok, the cheapest million-token window in
      OpenAI's published list above the Luna tier.
    evidence: [openai-pricing, openai-models]
  - id: data-analysis
    tier: strong-alternative
    rationale: >
      Priced low enough to run over large tabular inputs repeatedly, with a
      context window big enough to hold the data and the question together.
    evidence: [openai-pricing]

use_cases:
  - High-volume API workloads
  - Long-document analysis where the flagship price does not fit
  - The default tier in a system that escalates hard cases upward

strengths:
  - Same 1.05M context and 128K output as the flagship, at a fifth of the input price
  - Sits between Sol ($4/$20) and Luna ($0.20/$1.20), so the family covers a wide price range with one context size

weaknesses:
  - Below Astra and Sol in the provider's own tiering
  - The GPT-5.6 family went GA on 9 July 2026 and has since been superseded at the top by Astra
  - Output at $12/MTok is six times the input price, so output-heavy workloads cost more than the headline suggests

context_window:
